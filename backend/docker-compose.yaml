services:
  app-new:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: test-api-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db-new
    depends_on:
      db-new:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./:/var/www/html
    networks:
      - laravel-test

  web-new:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: test-api-web
    restart: unless-stopped
    depends_on:
      app-new:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel-test

  db-new:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel-test
    
  phpmyadmin-new:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db-new:
        condition: service_healthy
    environment:
      PMA_HOST: db-new
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8001:80"
    networks:
      - laravel-test


networks:
  laravel-test:
    driver: bridge

volumes:
  mysql-data:
    driver: local
